# Config fuer den Service lisocon-content-engine (railwayConfigFile, server-side gesetzt).
#
# BEWUSST OHNE cronSchedule: die Kadenz wird ausschliesslich via GraphQL
# serviceInstanceUpdate gesteuert. Traegt die toml einen cronSchedule, gewinnt
# sie gegen den Wert auf Service-Ebene und ein Deploy wuerde eine per API
# gesetzte Pause wieder scharf stellen. Belegt am Jolly-Service: dessen toml
# hatte "25 5 * * 1-5", die API meldete "50 7 * * 2", gelaufen ist die toml
# (16 Notion-Zeilen, jeder Werktag 05:46-05:52 UTC). Am 31.07.2026 angeglichen.
#
# Die aktuelle Kadenz steht NICHT hier. Kommentare zur Kadenz veralten
# strukturell, diese Zeile war schon zweimal falsch. Live-Wert lesen mit
# `railway status --json` oder per GraphQL `serviceInstance { cronSchedule
# nextCronRunAt }`, Crons laufen in UTC.
#
# PAUSED-Guard: Service-Env-Var PAUSED=1 laesst das startCommand ohne Lauf
# durchfallen, Re-Arm = Var loeschen. Damit stoppt man geplante Laeufe, ohne
# den Cron anzufassen.
# KORREKTUR 31.07.2026: hier stand, Railway fuehre das startCommand bei JEDEM
# Deploy einmal aus, jeder Push sei also ein Lauf. Gemessen an zwei Deploys am
# 30.07. (08:42 und 12:20 UTC+2) auf beiden Services: kein Apify-Lauf, keine
# neue Notion-Zeile, Deploys trotzdem SUCCESS. Fuer den Jolly-Service ist das
# eindeutig, weil run_research.run_daily keinen Tages-Guard hat. Ein Push
# kostet nichts und erzeugt keinen Content.

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "sh -c 'if [ \"$PAUSED\" = \"1\" ]; then echo \"lisocon-content-engine PAUSED, skipping run\"; else python run_research.py; fi'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
